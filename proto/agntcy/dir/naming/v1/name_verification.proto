syntax = "proto3";

package agntcy.dir.naming.v1;

import "google/protobuf/timestamp.proto";

// Verification represents the result of verifying a record's name ownership.
// It uses a oneof to support different verification types.
message Verification {
  oneof info {
    // Domain verification details.
    DomainVerification domain = 1;
    // Agent Name Service verification details.
    AnsVerification ans = 2;
    // Future verification types can be added here.
  }

  // When the verification was performed, whichever method verified the name.
  google.protobuf.Timestamp verified_at = 3;
}

// AnsVerification represents the result of verifying that a record's
// signing key belongs to the Agent Name Service (ANS) agent named by the
// record's ans:// name. The key is proven through the agent's identity
// certificate, attested by the agent's transparency log.
message AnsVerification {
  // The ANS name that was verified (e.g., "ans://v1.0.0.agent.example.com").
  string ans_name = 1;

  // The agent identifier in the transparency log.
  string agent_id = 2;

  // The agent host of the ANS name (e.g., "agent.example.com").
  string agent_host = 3;

  // Base URL of the transparency log that attested the certificate.
  string log_url = 4;

  // URL of the agent's SCITT receipt on the transparency log.
  string receipt_url = 5;

  // SHA-256 fingerprint ("SHA256:<hex>") of the identity certificate whose
  // key signed the record. Matches the transparency log's attestation.
  string cert_fingerprint = 6;

  // Agent status as reported by the transparency log at verification time.
  // A verified record carries ACTIVE, WARNING, or DEPRECATED.
  string agent_status = 7;
}

// DomainVerification represents the result of verifying that a record's
// signing key is authorized by the domain claimed in the record's name.
message DomainVerification {
  // The domain that was verified (e.g., "cisco.com").
  string domain = 1;

  // The verification method used: "wellknown".
  string method = 2;

  // The identifier of the domain's public key that matched the record's signing key.
  // This is the "id" field from the well-known file.
  string key_id = 3;

  // When the verification was performed.
  google.protobuf.Timestamp verified_at = 4;
}
